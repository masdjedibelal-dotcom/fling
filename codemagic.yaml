# Fling · iOS TestFlight via Codemagic
#
# Signing: hochgeladenes .p12 + Provisioning Profile in Codemagic UI
# (ios_signing). KEIN fetch-signing-files — das bricht ohne CERTIFICATE_PRIVATE_KEY.
#
# Environment group `fling_production`:
# - EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_PROJECT_ID
# Optional: EXPO_PUBLIC_DEMO_MOCKS=true
#
# App Store Connect: App com.flingapp.app + APP_STORE_APPLE_ID (numerische Apple-ID)

workflows:
  ios-testflight:
    name: Fling iOS · TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: fling

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flingapp.app
      groups:
        - fling_production
      vars:
        BUNDLE_ID: com.flingapp.app
        XCODE_WORKSPACE: Fling.xcworkspace
        XCODE_SCHEME: Fling
        # App Store Connect → App → Allgemein → Apple-ID (numerisch)
        APP_STORE_APPLE_ID: 0
        EXPO_PUBLIC_APP_VERSION: 1.0.2
      node: v20
      # Apple verlangt iOS-26-SDK (Xcode 26+) für App-Store-Uploads.
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Typecheck
        script: npm run lint

      - name: Resolve iOS build number
        script: bash scripts/ios-resolve-build-number.sh

      - name: Expo prebuild (iOS native project)
        script: npx expo prebuild --platform ios --clean

      - name: Export encryption compliance
        script: |
          PLIST="$CM_BUILD_DIR/ios/Fling/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Load signing certificates
        script: keychain add-certificates

      - name: Apply code signing
        script: xcode-project use-profiles

      - name: Apply iOS build number
        script: bash scripts/ios-apply-build-number.sh

      - name: Build IPA
        script: |
          set -o pipefail
          echo "Building Fling ${EXPO_PUBLIC_APP_VERSION:-?} (${IOS_BUILD_NUMBER:-?})"
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || {
              echo "Build fehlgeschlagen - relevante xcodebuild Fehlerausgaben:"
              for LOG in /tmp/xcodebuild_logs/*.log; do
                [ -f "$LOG" ] || continue
                echo ""
                echo "=== $LOG ==="
                sed -n '/error:/p;/ARCHIVE FAILED/p;/CodeSign/p;/Provisioning profile/p;/No signing certificate/p' "$LOG"
              done
              exit 1
            }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

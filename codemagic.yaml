# Fling · iOS TestFlight via Codemagic
# Setup: https://docs.codemagic.io/yaml-quick-start/first-signed-build/
#
# 1. Repo mit GitHub/GitLab verbinden
# 2. Codemagic → Teams → Integrations → App Store Connect API Key anlegen
#    Name unten bei `integrations.app_store_connect` eintragen
# 3. Environment variable group `fling_production` anlegen:
#    - EXPO_PUBLIC_SUPABASE_URL
#    - EXPO_PUBLIC_SUPABASE_ANON_KEY
#    - EXPO_PUBLIC_PROJECT_ID
# 4. App Store Connect → App mit Bundle ID com.flingapp.app anlegen
# 5. APP_STORE_APPLE_ID unten setzen (numerische ID aus App Store Connect → App-Info)

workflows:
  ios-testflight:
    name: Fling iOS · TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      # Name der App Store Connect Integration in Codemagic UI
      app_store_connect: fling

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flingapp.app
      groups:
        - fling_production
      vars:
        BUNDLE_ID: com.flingapp.app
        XCODE_WORKSPACE: Fling.xcworkspace
        XCODE_SCHEME: Fling
        # App Store Connect → App-Informationen → Apple-ID (Zahl)
        APP_STORE_APPLE_ID: 0
      node: v20
      # Apple verlangt seit 2026 iOS-26-SDK (Xcode 26+) für App-Store-Uploads.
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci --legacy-peer-deps

      - name: Typecheck
        script: npm run lint

      - name: Expo prebuild (iOS native project)
        script: npx expo prebuild --platform ios --clean

      - name: Export encryption compliance
        script: |
          PLIST="$CM_BUILD_DIR/ios/Fling/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Load signing certificates
        script: keychain add-certificates

      - name: Apply code signing
        script: xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios"
          if [ "$APP_STORE_APPLE_ID" = "0" ]; then
            echo "WARN: APP_STORE_APPLE_ID nicht gesetzt — BUILD_NUMBER aus Codemagic"
            LATEST=0
          else
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          fi
          agvtool new-version -all $(($LATEST + 1))

      - name: Build IPA
        script: |
          set -o pipefail
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" || {
              echo "Build fehlgeschlagen - relevante xcodebuild Fehlerausgaben:"
              for LOG in /tmp/xcodebuild_logs/*.log; do
                [ -f "$LOG" ] || continue
                echo ""
                echo "=== $LOG ==="
                sed -n '/error:/p;/ARCHIVE FAILED/p;/CodeSign/p;/Provisioning profile/p;/No signing certificate/p' "$LOG"
              done
              exit 1
            }

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
